<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title>ScreenBeam Live Stream</title>

<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

#player {
    width: 100%;
    height: 100%;
}

#player iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

</style>

</head>

<body>

<div id="player">

<iframe
    src="https://www.youtube.com/embed/live_stream?channel=UCUuwxQRny4pdc22UUJ2kbdQ&autoplay=1&mute=0&controls=0&playsinline=1"
    width="100%"
    height="100%"
    frameborder="0"
    allow="autoplay; encrypted-media; picture-in-picture"
    allowfullscreen>
</iframe>

</div>

</body>

</html>
