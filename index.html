<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ScreenBeam Live Stream</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

#player {
    width: 100%;
    height: 100%;
}

#player iframe {
    width: 100%;
    height: 100%;
    border: 0;
}
</style>
</head>

<body>

<div id="player"></div>

<script>

const API_KEY = "AIzaSyBS2k8V65d4UCI0Cu9LvG2bJmvemQg7-Lw";
const CHANNEL_ID = "UCUuwxQRny4pdc22UUJ2kbdQ";

let currentVideo = "";
let player = null;


// --------------------------------------------------
// Load YouTube IFrame API
// --------------------------------------------------

const tag = document.createElement("script");

tag.src = "https://www.youtube.com/iframe_api";

document.head.appendChild(tag);


// --------------------------------------------------
// YouTube API loaded
// --------------------------------------------------

function onYouTubeIframeAPIReady() {

    console.log("YouTube API loaded.");

    checkLiveStream();
}


// --------------------------------------------------
// Find current live stream
// --------------------------------------------------

async function checkLiveStream() {

    try {

        const response = await fetch(
            "https://www.googleapis.com/youtube/v3/search?" +
            "part=snippet" +
            "&channelId=" + CHANNEL_ID +
            "&eventType=live" +
            "&type=video" +
            "&key=" + API_KEY
        );

        const data = await response.json();


        if (data.items && data.items.length > 0) {

            const videoId = data.items[0].id.videoId;

            console.log("Live stream:", videoId);


            // Don't reload the same stream
            if (videoId === currentVideo) {
                return;
            }


            currentVideo = videoId;


            // Destroy previous player
            if (player) {
                player.destroy();
                player = null;
            }


            // Create new player
            player = new YT.Player("player", {

                videoId: videoId,

                playerVars: {
                    autoplay: 1,
                    controls: 0,
                    playsinline: 1,
                    rel: 0
                },

                events: {

                    onReady: function(event) {

                        console.log("YouTube player ready.");

                        // Attempt autoplay with audio
                        event.target.unMute();
                        event.target.setVolume(100);
                        event.target.playVideo();

                    },


                    onStateChange: function(event) {

                        if (event.data === YT.PlayerState.PLAYING) {

                            console.log("VIDEO PLAYING");

                            // Make sure audio is enabled
                            event.target.unMute();
                            event.target.setVolume(100);

                        }

                    },


                    onAutoplayBlocked: function() {

                        console.log(
                            "AUTOPLAY WITH AUDIO WAS BLOCKED"
                        );

                    },


                    onError: function(event) {

                        console.log(
                            "YouTube error:",
                            event.data
                        );

                    }

                }

            });

        }

        else {

            console.log("No live stream currently active.");

            currentVideo = "";

            if (player) {

                player.destroy();
                player = null;

            }

            document.getElementById("player").innerHTML = "";

        }

    }

    catch (error) {

        console.log("API error:", error);

    }

}


// Check every minute
setInterval(checkLiveStream, 60000);

</script>

</body>
</html>
