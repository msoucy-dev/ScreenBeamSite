<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ScreenBeam Live Stream</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

#player {
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<div id="player"></div>

<script>

const API_KEY = "AIzaSyBS2k8V65d4UCI0Cu9LvG2bJmvemQg7-Lw";
const CHANNEL_ID = "UCSJ4gkVC6NrvII8umztf0Ow";

let currentVideo = "";

// Find currently live video
async function checkLiveStream() {

    try {

        const response = await fetch(
            "https://www.googleapis.com/youtube/v3/search?" +
            "part=snippet" +
            "&channelId=" + CHANNEL_ID +
            "&eventType=live" +
            "&type=video" +
            "&key=" + API_KEY
        );

        const data = await response.json();

        if (data.items && data.items.length > 0) {

            const videoId = data.items[0].id.videoId;

            // Only reload if stream changed
            if (videoId !== currentVideo) {

                currentVideo = videoId;

                document.getElementById("player").innerHTML =
                    `<iframe
                        width="100%"
                        height="100%"
                        src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&controls=0"
                        frameborder="0"
                        allow="autoplay; encrypted-media"
                        allowfullscreen>
                    </iframe>`;
            }

        } else {

            currentVideo = "";

            document.getElementById("player").innerHTML = "";
            document.body.style.background = "black";
        }

    } catch (err) {

        console.log(err);
    }
}

// Check immediately
checkLiveStream();

// Then check every minute
setInterval(checkLiveStream, 60000);

</script>

</body>
</html>
