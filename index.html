<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ScreenBeam Live Stream</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

#player {
    width: 100%;
    height: 100%;
}

#player iframe {
    width: 100%;
    height: 100%;
    border: 0;
}
</style>
</head>

<body>

<div id="player"></div>

<script>

const API_KEY = "AIzaSyBS2k8V65d4UCI0Cu9LvG2bJmvemQg7-Lw";
const CHANNEL_ID = "UCUuwxQRny4pdc22UUJ2kbdQ";

let currentVideo = "";


// Find currently live video
async function checkLiveStream() {

    try {

        const response = await fetch(
            "https://www.googleapis.com/youtube/v3/search?" +
            "part=snippet" +
            "&channelId=" + CHANNEL_ID +
            "&eventType=live" +
            "&type=video" +
            "&key=" + API_KEY
        );

        const data = await response.json();

        console.log("YouTube API response:", data);


        if (data.items && data.items.length > 0) {

            const videoId = data.items[0].id.videoId;

            console.log("Current live video:", videoId);


            // Only reload if the live stream changed
            if (videoId !== currentVideo) {

                currentVideo = videoId;

                document.getElementById("player").innerHTML =
                    `<iframe
                        src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&controls=0&playsinline=1"
                        width="100%"
                        height="100%"
                        frameborder="0"
                        allow="autoplay; encrypted-media; picture-in-picture"
                        allowfullscreen>
                    </iframe>`;

            }

        } else {

            console.log("No live stream currently active.");

            currentVideo = "";

            document.getElementById("player").innerHTML = "";

        }

    } catch (err) {

        console.error("Error checking live stream:", err);

    }
}


// Check immediately
checkLiveStream();


// Check every minute
setInterval(checkLiveStream, 60000);

</script>

</body>
</html>
