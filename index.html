<!DOCTYPE html>
<html>
<head>
  <title>ScreenBeam YouTube Stream Controller</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: black; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <!-- The YouTube Player will load here -->
  <div id="player"></div>

  <script>
    // 1. Load the YouTube Iframe Player API asynchronously
    var tag = document.createElement('script');
    tag.src = "https://youtube.com";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: 'YMXWjdzdRv0?si=mpvSw4glqCrMl3lt', // <-- REPLACE THIS WITH YOUR VIDEO ID
        playerVars: {
          'autoplay': 1,
          'controls': 0, // Hides player controls for a clean signage look
          'rel': 0
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      event.target.playVideo();
    }

    // 2. Listen for the video to end
    function onPlayerStateChange(event) {
      // YT.PlayerState.ENDED is 0
      if (event.data === YT.PlayerState.ENDED) {
        // Redirect to a blank page. This forces ScreenBeam to exit signage mode
        window.location.href = "about:blank";
      }
    }
  </script>
</body>
</html>
