<!DOCTYPE html>
<html>
<head>
  <title>ScreenBeam YouTube Stream Controller</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: black; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <!-- The YouTube Player will load here -->
  <div id="player"></div>

  <script>
    // 1. Load the YouTube Iframe Player API asynchronously
    var tag = document.createElement('script');
    tag.src = "https://youtube.com";
    var firstScriptTag = document.getElementsByTagName('script');
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: 'rFZHOHl-L8A', // <-- MAKE SURE YOUR VIDEO ID IS CORRECT HERE
        playerVars: {
          'autoplay': 1,
          'mute': 1,        // <-- CRITICAL FIX: Mutes the video so the browser allows autoplay
          'controls': 0,    // Hides player controls for clean digital signage
          'rel': 0,
          'playsinline': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      event.target.playVideo();
    }

    // 2. Listen for the video to end
    function onPlayerStateChange(event) {
      // YT.PlayerState.ENDED is 0
      if (event.data === YT.PlayerState.ENDED) {
        // Redirects to a blank page. ScreenBeam exits signage mode when a URL becomes unreachable.
        window.location.href = "about:blank";
      }
    }
  </script>
</body>
</html>
