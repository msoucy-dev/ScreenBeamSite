<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ScreenBeam Live Stream</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

#player {
    width: 100%;
    height: 100%;
}

#player iframe {
    width: 100%;
    height: 100%;
    border: 0;
}
</style>
</head>

<body>

<div id="player"></div>

<script>

const API_KEY = "AIzaSyBS2k8V65d4UCI0Cu9LvG2bJmvemQg7-Lw";
const CHANNEL_ID = "UCUuwxQRny4pdc22UUJ2kbdQ";

let currentVideo = "";
let firstCheck = true;


// --------------------------------------------------
// Find the current live stream
// --------------------------------------------------

async function checkLiveStream() {

    try {

        console.log("Checking for current live stream...");

        const response = await fetch(
            "https://www.googleapis.com/youtube/v3/search?" +
            "part=snippet" +
            "&channelId=" + CHANNEL_ID +
            "&eventType=live" +
            "&type=video" +
            "&key=" + API_KEY
        );

        const data = await response.json();

        console.log("YouTube API response:", data);

        if (data.items && data.items.length > 0) {

            const videoId = data.items[0].id.videoId;

            console.log("Current live video:", videoId);


            // New stream detected
            if (videoId !== currentVideo) {

                console.log("Loading live stream:", videoId);

                currentVideo = videoId;

                loadVideo(videoId);
            }

        } else {

            console.log("No live stream currently active.");

            if (currentVideo !== "") {
                currentVideo = "";
                document.getElementById("player").innerHTML = "";
            }
        }

    } catch (err) {

        console.error("Error checking YouTube:", err);

    }

}


// --------------------------------------------------
// Load YouTube video
// --------------------------------------------------

function loadVideo(videoId) {

    const player = document.getElementById("player");

    player.innerHTML =
        `<iframe
            src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&controls=0&playsinline=1&rel=0"
            width="100%"
            height="100%"
            frameborder="0"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen>
        </iframe>`;

}


// --------------------------------------------------
// Check immediately
// --------------------------------------------------

checkLiveStream();


// --------------------------------------------------
// Check for a new stream every minute
// --------------------------------------------------

setInterval(checkLiveStream, 60000);

</script>

</body>
</html>
