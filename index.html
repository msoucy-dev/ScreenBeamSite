<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ScreenBeam Live Stream</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

#player {
    width: 100%;
    height: 100%;
}

#player iframe {
    width: 100%;
    height: 100%;
    border: 0;
}
</style>
</head>

<body>

<div id="player"></div>

<script>
const API_KEY = "YOUR_API_KEY";
const CHANNEL_ID = "UCUuwxQRny4pdc22UUJ2kbdQ";

let currentVideo = "";
let player = null;
let pendingVideoId = null;


// --------------------------------------------------
// Load YouTube IFrame API
// --------------------------------------------------

const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";

document.head.appendChild(tag);


// --------------------------------------------------
// YouTube API ready
// --------------------------------------------------

function onYouTubeIframeAPIReady() {

    console.log("YouTube IFrame API loaded");

    checkLiveStream();
}


// --------------------------------------------------
// Find currently live stream
// --------------------------------------------------

async function checkLiveStream() {

    try {

        const response = await fetch(
            "https://www.googleapis.com/youtube/v3/search?" +
            "part=snippet" +
            "&channelId=" + CHANNEL_ID +
            "&eventType=live" +
            "&type=video" +
            "&key=" + API_KEY
        );

        const data = await response.json();

        if (!data.items || data.items.length === 0) {

            console.log("No live stream currently active.");

            currentVideo = "";

            if (player) {
                player.destroy();
                player = null;
            }

            document.getElementById("player").innerHTML = "";

            return;
        }


        const videoId = data.items[0].id.videoId;

        console.log("Current live stream:", videoId);


        // Don't reload the player if it is already playing
        if (videoId === currentVideo) {
            return;
        }


        currentVideo = videoId;
        pendingVideoId = videoId;


        createPlayer(videoId);

    } catch (err) {

        console.error("Live stream check failed:", err);

    }
}


// --------------------------------------------------
// Create YouTube player
// --------------------------------------------------

function createPlayer(videoId) {

    if (player) {

        player.destroy();
        player = null;
    }


    player = new YT.Player("player", {

        videoId: videoId,

        playerVars: {
            autoplay: 1,
            controls: 0,
            playsinline: 1,
            rel: 0,
            enablejsapi: 1,
            origin: window.location.origin
        },

        events: {

            onReady: function(event) {

                console.log("YouTube player ready.");

                // Attempt to play WITH AUDIO
                event.target.unMute();
                event.target.setVolume(100);
                event.target.playVideo();

            },

            onStateChange: function(event) {

                if (event.data === YT.PlayerState.PLAYING) {

                    console.log("Live stream is playing.");

                    // Make sure audio is enabled
                    event.target.unMute();
                    event.target.setVolume(100);
                }

            },

            onAutoplayBlocked: function() {

                console.warn(
                    "Autoplay with audio was blocked by the browser."
                );

            },

            onError: function(event) {

                console.error(
                    "YouTube player error:",
                    event.data
                );

            }
        }
    });
}


// --------------------------------------------------
// Check for a new live stream every minute
// --------------------------------------------------

setInterval(checkLiveStream, 60000);

</script>

</body>
</html>
